[package]
name = "dhlrc-resource"
version = "0.1.0"
edition = "2024"
description = "Minecraft's resource files: ids, packs, the client jar and the asset store."

[dependencies]
# Reads the resource zips: a version's client jar, a resource pack, a mod jar.
zip = { version = "2", default-features = false, features = ["deflate"] }
# The asset index is JSON, so the object store can be resolved by name.
serde_json = "1"

[lib]
crate-type = ["lib"]

[package]
name = "dhlrc-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
# The asset index is JSON, so the object store can be resolved by name.
serde_json = "1"
common-rs = { path = "../common-rs" }
dhlrc-resource = { path = "../dhlrc-resource" }
formatx = "0.2.4"
notify = "8"
# Opens the plugin libraries (`region_module/`, `load_module/`).
libloading = "0.8"
# The downloader: fetches the version manifest, asset index and objects over
# HTTPS. `tls` is rustls, so no system OpenSSL is needed.
ureq = { version = "2", default-features = false, features = ["tls"] }
# Reads and writes the HTTP `Last-Modified` date the freshness check compares.
httpdate = "1"
# Only pulled in by the `desktop-notifications` feature; a headless or terminal
# build leaves it out and prints the `Notification` instead.
notify-rust = { version = "4", optional = true }
# Only pulled in by the `render` feature: the software renderer behind the
# `dhlrc_render_*` C ABI, so a frontend that never draws a block does not
# carry the geometry.
dhlrc-render = { path = "../dhlrc-render", optional = true }

[features]
# Shows the core's notifications as desktop notifications (D-Bus on Linux/BSD,
# a toast on Windows, Notification Center on macOS).
desktop-notifications = ["dep:notify-rust"]
# Offers the block renderer over the C ABI (`dhlrc_render_*`), which the Qt
# view draws a region through.
render = ["dep:dhlrc-render"]

[lib]
# An `rlib` for the Rust frontends and a `cdylib` for the C/C++ ones.
crate-type = ["lib", "cdylib"]

# Only built with the feature, so `cargo build --workspace` leaves it alone.
[[example]]
name = "desktop_notify"
required-features = ["desktop-notifications"]

# The renderer's C ABI, smoke-tested against a region built in memory.
[[example]]
name = "render_region"
required-features = ["render"]

[dev-dependencies]
# Builds the `UtcDateTime` the example's region needs.
time = "0.3"

# Android has no libintl; `gettext-shim` stands in and messages stay English.
[target.'cfg(not(target_os = "android"))'.dependencies]
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }

[target.'cfg(target_os = "android")'.dependencies]
gettextrs = { package = "dhlrc-gettext-shim", path = "../gettext-shim" }

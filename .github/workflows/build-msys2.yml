name: MSYS2 build

on:
  # A tag is the release trigger: building and packaging on every push or pull
  # request spent Windows runner time and artifact storage for nothing, so
  # those events no longer start a run. Push a tag (the tag names are dates) to
  # get a build with the portable archive and the installer.
  push:
    tags: ['*']
  # Manual runs stay as an escape hatch: the checkbox also packages.
  workflow_dispatch:
    inputs:
      package:
        description: Also build the portable archive and the installer
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: UCRT64 build
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gettext-runtime
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-extra-cmake-modules
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-kcolorscheme
            mingw-w64-ucrt-x86_64-breeze
            mingw-w64-ucrt-x86_64-kconfigwidgets
            mingw-w64-ucrt-x86_64-kcoreaddons
            mingw-w64-ucrt-x86_64-kwidgetsaddons
            mingw-w64-ucrt-x86_64-kiconthemes
            mingw-w64-ucrt-x86_64-ki18n
            mingw-w64-ucrt-x86_64-nsis
            unzip

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build-ucrt64/cargo_build
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Since we need link, remove tests and try build

      - name: Build
        env:
          # A tag push is a release: it packages without being asked. A manual
          # run packages only when the box was ticked.
          PACKAGE: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.package }}
        run: |
          set -euo pipefail
          args=(--yes)
          # A manual run can also produce the distributable package.
          if [ "${PACKAGE:-false}" = "true" ]; then
            args+=(--package)
          fi
          ./build-msys2.sh "${args[@]}"

      - name: Smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          # The terminal frontend first: it needs no window station.
          ./build-ucrt64/cargo_build/release/dhlrc-tui.exe --version
          ./build-ucrt64/dhlrc_qt.exe --version

      - name: Check the packaged runtime
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.package }}
        run: |
          set -euo pipefail
          # The Breeze style plugin and its theme files have to be inside the
          # archive; without them the window falls back to the platform style.
          ls -l build-ucrt64/runtime-gui/styles
          unzip -l build-ucrt64/dhlrc-*.zip | grep -q 'styles/breeze6.dll'
          unzip -l build-ucrt64/dhlrc-*.zip | grep -q 'kstyle/themes/breeze.themerc'
          # The icon engine is what makes the icons follow the colour scheme
          # (dark mode); without it they stay dark on a dark window.
          unzip -l build-ucrt64/dhlrc-*.zip | grep -q 'kiconthemes6/iconengines/KIconEnginePlugin.dll'
          # Qt's own catalogue translates the standard dialog buttons, KF6's
          # the framework strings.
          unzip -l build-ucrt64/dhlrc-*.zip | grep -q 'translations/qtbase_zh_CN.qm'
          unzip -l build-ucrt64/dhlrc-*.zip | grep -q 'data/locale/zh_CN/LC_MESSAGES/kwidgetsaddons6_qt.qm'

      # One artifact per deliverable, so the portable archive and the installer
      # can be downloaded separately from the run page instead of as one
      # archive containing both.
      - name: Upload portable archive
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.package }}
        uses: actions/upload-artifact@v4
        with:
          name: dhlrc-ucrt64-portable
          path: build-ucrt64/dhlrc-*.zip
          if-no-files-found: error

      - name: Upload installer
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || inputs.package }}
        uses: actions/upload-artifact@v4
        with:
          name: dhlrc-ucrt64-installer
          # The installer's own file name (see DH_OUTFILE_NATIVE in
          # CMakeLists.txt). A broad `dhlrc-*.exe` would also pick up
          # `dhlrc-tui.exe`, which lives in the same directory.
          path: build-ucrt64/dhlrc-*-win64-setup.exe
          if-no-files-found: error

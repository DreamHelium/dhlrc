[package]
name = "dhlrc-tui"
version = "0.1.0"
edition = "2024"
description = "Terminal frontend for dhlrc (experimental)."

[[bin]]
name = "dhlrc-tui"
path = "src/main.rs"

[dependencies]
# `string` lets the translated help texts (gettext returns `String`) be passed
# to clap's `help`/`about` builders.
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
dhlrc-core = { path = "../dhlrc-core" }
# The `render` command draws through the same software renderer the Qt view
# does, reading its models and textures through the resource layer.
dhlrc-render = { path = "../dhlrc-render" }
dhlrc-resource = { path = "../dhlrc-resource" }
formatx = "0.2.4"
# Loading the region modules reads their symbols at run time, and `libregion_rs`
# has to be opened before them and process-wide so a plugin's own `region_new`
# resolves against it.
libloading = "0.8"
# The columns in the `modules` output have to line up in Chinese too, where a
# character is two terminal cells wide.
unicode-width = "0.2"

# Android has no libintl; `gettext-shim` stands in and messages stay English.
[target.'cfg(not(target_os = "android"))'.dependencies]
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }

[target.'cfg(target_os = "android")'.dependencies]
gettextrs = { package = "dhlrc-gettext-shim", path = "../gettext-shim" }

[package]
name = "region-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = { version = "1.1.8", features = ["zlib-rs"] }
sysinfo = "0.38.1"
common-rs = { path = "../common-rs" }
time = "0.3.44"
whoami = "2.0.1"
zuri_nbt = "0.5.0"

[lib]
crate-type = ["cdylib"]

# Android has no libintl; `gettext-shim` stands in and messages stay English.
[target.'cfg(not(target_os = "android"))'.dependencies]
gettext-rs = { version = "0.7.7", features = ["gettext-system"] }

[target.'cfg(target_os = "android")'.dependencies]
gettextrs = { package = "dhlrc-gettext-shim", path = "../gettext-shim" }
